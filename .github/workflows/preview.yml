# معاينة staging على GitHub Pages.
#
# تُبنى من `main` وتُقدَّم شيفرة هذا المستودع نفسها — لا نسخة موازية.
#
# لماذا النشر إلى فرع `gh-pages` لا عبر `deploy-pages`:
# رمز الـActions لا يملك صلاحية إنشاء موقع Pages ("Resource not accessible by
# integration")، فمسار `configure-pages` بـ`enablement: true` فشل. أما الدفع إلى
# فرع `gh-pages` فيُفعّل الموقع تلقائياً ولا يحتاج إلا صلاحية الكتابة على
# المحتوى — وهي متاحة. النتيجة واحدة والطريق أقصر.
#
# القيم أدناه ليست أسراراً: `VITE_SUPABASE_PUBLISHABLE_KEY` مفتاح منشور بحكم
# تصميمه ويُشحن داخل حزمة المتصفح في أي حال، وRLS هي الحماية لا كتمانه. ولا
# يوجد هنا service_role ولا مفتاح دفع ولا أي سرّ.
name: Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# نشرة واحدة في كل مرة؛ الأحدث يفوز ولا يُلغى وهو في منتصف النشر.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: بناء المعاينة ونشرها
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: بناء
        env:
          # الموقع يُقدَّم من ‎/<repo>/‎ لا من الجذر.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_APP_ENV: staging
          VITE_SUPABASE_URL: https://imejhwkgvvhojllkchmg.supabase.co
          VITE_SUPABASE_PROJECT_ID: imejhwkgvvhojllkchmg
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Y_vxX7YRJVZ2jPEBVFCDsA_whhMEF98
          VITE_PAYMENT_MODE: mock
          VITE_MESSAGING_MODE: mock
          VITE_EMAIL_MODE: disabled
          VITE_SHIPPING_MODE: mock
          VITE_ANALYTICS_MODE: disabled
        run: npm run build

      - name: تهيئة المخرجات للاستضافة الساكنة
        run: |
          # تطبيق صفحة واحدة: أي مسار عميق يصل كـ404، فتُقدَّم نسخة من
          # index.html ويتولى الموجّه الباقي. بدونها ‎/admin‎ و‎/outbox‎ تفتحان
          # صفحة خطأ عند التحديث المباشر.
          cp dist/index.html dist/404.html
          # يمنع Jekyll من ابتلاع الملفات التي تبدأ بشرطة سفلية.
          touch dist/.nojekyll

      - name: نشر إلى gh-pages
        run: |
          set -e
          cd dist
          git init -q
          git checkout -qb gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "معاينة staging من ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
          echo "المعاينة: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
